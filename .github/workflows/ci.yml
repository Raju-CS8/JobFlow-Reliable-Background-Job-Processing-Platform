name: JobFlow CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobflow
          POSTGRES_PASSWORD: jobflow
          POSTGRES_DB: jobflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jobflow -d jobflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.104.1 uvicorn==0.24.0 pydantic==2.5.0
          pip install sqlalchemy==2.0.23 alembic==1.13.0
          pip install psycopg2-binary==2.9.9 httpx==0.25.2
          pip install pytest==7.4.3 pytest-asyncio==0.21.1

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://jobflow:jobflow@localhost:5432/jobflow
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://jobflow:jobflow@localhost:5432/jobflow
        run: |
          pytest -v